<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia Prima PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

   <!-- 1. Carica la libreria OneSignal -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<!-- 2. Configurazione personalizzata per la tua cartella -->
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "09a603b0-4db1-44df-b6de-0190f3945853",
      // Specifichiamo dove si trova il file JS
      serviceWorkerPath: "OneSignalSDKWorker.js",
      // Specifichiamo il raggio d'azione (fondamentale per GitHub Pages)
      serviceWorkerParam: { scope: "/mia-pwapp2/" }
    });

    // Forza la richiesta del permesso su iOS
    if (OneSignal.Notifications.permission !== "granted") {
        await OneSignal.Notifications.requestPermission();
    }
  });
</script>
</head>
<body>

    <header class="main-header">
        <div class="top-green-bar"></div>
        <div class="header-content">
            <div class="logo">
                <img src="logo.png" alt="Farmacia Brunello"> </div>
            <div class="header-icons">
                <button class="icon-btn">📧</button>
                <button class="icon-btn">☎️</button>
            </div>
        </div>
    </header>

    <main class="scrollable-content">
        <section class="section">
            <div class="section-header">
                <h2>EVENTI</h2>
                <a href="#">Vedi tutti</a>
            </div>
            <div class="card-container">
                <div class="card landscape-placeholder"></div>
                <div class="card landscape-placeholder"></div>
            </div>
        </section>

        <section class="section notification-panel">
            <h3>Gestione Notifiche</h3>
            <div id="loading-status">Caricamento...</div>
            <button id="subscribe-btn" class="btn btn-subscribe" style="display:none;">🔔 Attiva Notifiche</button>
            <button id="unsubscribe-btn" class="btn btn-unsubscribe" style="display:none;">🔕 Disattiva Notifiche</button>
        </section>

        <section class="section">
            <div class="section-header">
                <h2>PROMOZIONI</h2>
                <a href="#">Vedi tutti</a>
            </div>
            <div class="card-container">
                <div class="card square-placeholder"></div>
                <div class="card square-placeholder"></div>
            </div>
        </section>
    </main>

    <footer class="main-nav">
        <div class="nav-item active">
            <span class="nav-icon">✔️</span>
            <span class="nav-label">HOME</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">✔️</span>
            <span class="nav-label">PRENOTA</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">✔️</span>
            <span class="nav-label">TURNI</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">✔️</span>
            <span class="nav-label">INFO</span>
        </div>
    </footer>

    <script>
        // ... (tutto il tuo codice OneSignal inviato sopra) ...
    </script>
</body>
</html>
