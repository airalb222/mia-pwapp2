<!DOCTYPE html>
<html lang="it">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Farmacia Brunello">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="manifest" href="manifest.json">
    
    <title>Farmacia Brunello</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "09a603b0-4db1-44df-b6de-0190f3945853",
          serviceWorkerPath: "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/mia-pwapp2/" }
        });
        updateButtons();
      });
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    
<header class="main-header">
    <div class="header-content">
        <div class="logo">
            <a href="index.html" title="Torna alla Home">
                <img src="logo-farmacia.svg" alt="Farmacia Brunello" class="logo-image">
            </a>
        </div>
        <div class="header-icons">
            <a href="tel:+390422491591" class="nav-item-header">
                <span class="material-symbols-outlined nav-icon">call</span>
                <span class="nav-label">CHIAMA</span>
            </a>
        </div>
    </div>
</header>
    
<main class="scrollable-content">
    <section class="section notification-panel">
        <div style="background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom: 10px; font-size: 1rem;">Resta aggiornato</h3>
            <div id="loading-status">Verifica stato...</div>
            <button id="subscribe-btn" class="btn btn-subscribe" style="display:none;">🔔 Attiva Notifiche</button>
            <button id="unsubscribe-btn" class="btn btn-unsubscribe" style="display:none;">🔕 Disattiva Notifiche</button>
        </div>
    </section>

    <section class="events-section">
        <div class="section-header">
            <h2>Prossimi Eventi</h2>
            <span class="view-all">Vedi tutti</span>
        </div>
        <div class="events-container" id="events-list">
            <div class="event-card">Caricamento eventi...</div>
        </div>
    </section>

    <section id="turni-section" class="section" style="display:none; padding: 0 20px;">
    <div class="section-header">
        <h2>Turni Farmacia</h2>
    </div>
    
    <div id="turno-attuale-container">
        <p style="font-size: 0.9rem; margin-bottom: 10px; color: #666;">Turno in corso:</p>
        <div class="shift-card-main">
            <img id="img-turno-attuale" src="" class="zoomable-img" alt="Turno Attuale">
        </div>
    </div>

    <div id="altri-turni" style="margin-top: 25px;">
        <p style="font-size: 0.8rem; font-weight: bold; color: var(--ios-grey); text-transform: uppercase;">Altre settimane</p>
        <div class="events-container" id="lista-altri-turni" style="padding: 10px 0;">
            </div>
    </div>
</section>

<div id="zoom-modal" class="modal">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="img-zoomato">
</div>
    
</main>

<footer class="main-nav">
    <div class="nav-item active">
        <span class="material-symbols-outlined nav-icon">home</span>
        <span class="nav-label">HOME</span>
    </div>
    <div class="nav-item">
        <span class="material-symbols-outlined nav-icon">calendar_month</span>
        <span class="nav-label">PRENOTA</span>
    </div>
    <div class="nav-item">
        <span class="material-symbols-outlined nav-icon">schedule</span>
        <span class="nav-label">TURNI</span>
    </div>
    <div class="nav-item">
        <span class="material-symbols-outlined nav-icon">settings</span>
        <span class="nav-label">IMPOSTAZIONI</span>
    </div>
</footer>

<script>
    // 1. Gestione Pulsanti Notifiche
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    function updateButtons() {
        OneSignalDeferred.push(async function(OneSignal) {
            const isOptedIn = OneSignal.User.PushSubscription.optedIn;
            const hasPermission = OneSignal.Notifications.permission;
            document.getElementById('loading-status').style.display = 'none';

            if (isOptedIn && hasPermission) {
                document.getElementById('subscribe-btn').style.display = 'none';
                document.getElementById('unsubscribe-btn').style.display = 'block';
            } else {
                document.getElementById('subscribe-btn').style.display = 'block';
                document.getElementById('unsubscribe-btn').style.display = 'none';
            }
        });
    }

    OneSignalDeferred.push(function(OneSignal) {
        OneSignal.User.PushSubscription.addEventListener("change", updateButtons);
    });

    document.getElementById('subscribe-btn').addEventListener('click', function() {
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.User.PushSubscription.optIn();
            await OneSignal.Notifications.requestPermission();
            updateButtons();
        });
    });

    document.getElementById('unsubscribe-btn').addEventListener('click', function() {
        OneSignalDeferred.push(function(OneSignal) {
            OneSignal.User.PushSubscription.optOut();
            updateButtons();
        });
    });

    // 2. Gestione Menu Navigazione
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
        item.addEventListener('click', function() {
            navItems.forEach(nav => nav.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // 3. Funzione Caricamento Eventi da Google Sheet (SheetDB)
async function loadEvents() {
    const eventsList = document.getElementById('events-list');
    const API_URL = 'https://sheetdb.io/api/v1/mcvst24hmpts3';
    
    // URL di un'immagine di default (puoi cambiarlo con un tuo logo o una foto fissa)
    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1586015555751-63bb77f4322a?q=80&w=1000&auto=format&fit=crop';

    try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (!data || data.length === 0) {
            eventsList.innerHTML = '<div class="event-card"><div class="event-info">Nessun evento in programma.</div></div>';
            return;
        }

        eventsList.innerHTML = ''; 

        data.forEach(event => {
            // Controllo se l'immagine esiste nel foglio, altrimenti uso quella di default
            const imgUrl = (event.immagine && event.immagine.trim() !== "") ? event.immagine : DEFAULT_IMAGE;

            const card = `
                <div class="event-card">
                    <img src="${imgUrl}" 
                         class="event-image" 
                         alt="${event.titolo}" 
                         onerror="this.onerror=null;this.src='${DEFAULT_IMAGE}';">
                    <div class="event-info">
                        <span class="event-date">${event.data || 'Prossimamente'}</span>
                        <h4 class="event-title">${event.titolo || 'Nuovo Evento'}</h4>
                    </div>
                </div>
            `;
            eventsList.innerHTML += card;
        });
    } catch (error) {
        console.error("Errore nel caricamento eventi:", error);
        eventsList.innerHTML = '<div class="event-card"><div class="event-info">Errore di connessione.</div></div>';
    }
}

    // Avvia il caricamento eventi all'apertura
    loadEvents();
</script>

</body>
</html>
